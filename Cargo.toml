[package]
name = "trace-search-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "HTTP-only MCP server for indexed access to very large line-oriented files"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytecount = "0.6.9"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.5"
fs2 = "0.4"
memchr = "2.8"
regex = "1.11"
rmcp = { version = "3.3.0", features = ["transport-streamable-http-server"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
